<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<title>Panel</title>
<style>
/* El fondo cambia con la hora: óxido en la mañana, cobalto en la tarde, índigo en la noche */
:root, .tarde { --fondo:#16246E; --tinta:#FFFFFF; --suave:rgba(255,255,255,.62); --hoja:rgba(255,255,255,.09); --linea:rgba(255,255,255,.16); --acento:#7FA2FF; }
.manana { --fondo:#6E2A10; --tinta:#FFF4EC; --suave:rgba(255,244,236,.62); --hoja:rgba(255,255,255,.09); --linea:rgba(255,255,255,.16); --acento:#FF9A5C; }
.noche  { --fondo:#100A2B; --tinta:#E6E0FF; --suave:rgba(230,224,255,.55); --hoja:rgba(255,255,255,.06); --linea:rgba(255,255,255,.12); --acento:#9C86FF; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:var(--fondo); color:var(--tinta); font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.4; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  display:flex; flex-direction:column; padding:24px 26px 10px; transition:background-color 3s; }
button { font:inherit; cursor:pointer; }
.condensada { font-family:"Avenir Next Condensed","Arial Narrow",sans-serif; }

header { display:flex; justify-content:space-between; align-items:flex-start; }
.reloj { font-size:128px; font-weight:700; line-height:.8; letter-spacing:-4px; }
.reloj small { font-size:28px; font-weight:600; letter-spacing:0; margin-left:8px; color:var(--suave); }
.fecha { font-size:22px; font-weight:600; margin-top:14px; }
.saludo { color:var(--suave); font-size:17px; }
.saludo button { border:0; background:none; color:var(--suave); text-decoration:underline; margin-left:10px; font-size:15px; }
.clima { text-align:right; padding-top:6px; }
.clima .temp { font-size:64px; font-weight:700; line-height:1; letter-spacing:-2px; }
.clima .desc { font-weight:600; font-size:18px; }
.clima .rango { color:var(--suave); }

main { flex:1; display:flex; min-height:0; margin-top:24px; }
section { flex:1; min-width:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:16px; }
section + section { margin-left:18px; }
h2 { font-size:30px; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline; }
h2 .cuenta, .sub { font-family:"Avenir Next",Arial,sans-serif; font-size:15px; font-weight:500; color:var(--suave); }
h4 { font-size:15px; font-weight:600; color:var(--suave); margin:12px 0 4px; }

.tarjeta { background:var(--hoja); border-radius:18px; padding:12px 8px 14px 16px; margin-bottom:12px; }
.tarjeta h3 { font-size:18px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
.elem { display:flex; align-items:center; min-height:46px; }
.caja { width:26px; height:26px; flex:none; margin-right:12px; border:2px solid var(--tinta); border-radius:50%;
  background:transparent; color:var(--fondo); font-size:14px; font-weight:700; line-height:22px; }
.hecho .caja { background:var(--acento); border-color:var(--acento); }
.texto { flex:1; min-width:0; }
.hecho .texto { text-decoration:line-through; color:var(--suave); }
.nota { font-size:13px; color:var(--suave); margin-left:8px; white-space:nowrap; }
.nota.tarde-ya { color:var(--acento); font-weight:600; }
.quitar { width:40px; height:40px; flex:none; border:0; background:none; color:var(--suave); font-size:22px; }
.vacio { color:var(--suave); padding:4px 0 8px; }

.fila { display:flex; margin-top:8px; }
.fila > * + * { margin-left:8px; }
input { flex:1; min-width:0; font:inherit; padding:10px 16px; border:0; border-radius:999px;
  background:var(--hoja); color:var(--tinta); -webkit-appearance:none; outline:none; min-height:42px; }
input:focus { box-shadow:0 0 0 2px var(--acento); }
input::-webkit-input-placeholder { color:var(--suave); }
input::placeholder { color:var(--suave); }
.btn { flex:none; padding:9px 16px; border:0; border-radius:999px; background:var(--tinta); color:var(--fondo); font-weight:600; }
.btn.fantasma { background:transparent; color:var(--suave); padding:9px 10px; }
.btn.fantasma.activo { background:var(--acento); color:var(--fondo); }
.enlace { border:0; background:none; color:var(--suave); text-decoration:underline; font-size:14px; }

/* Contenido */
.proximo { display:flex; padding:3px 0; font-size:15px; }
.proximo b { width:86px; flex:none; font-weight:600; color:var(--suave); }
.dias { display:flex; margin:4px 0 10px; }
.chip { width:32px; height:32px; margin-right:5px; border-radius:50%; border:1px solid var(--linea); background:transparent;
  color:var(--suave); font-size:13px; font-weight:600; }
.chip.activo { background:var(--acento); border-color:var(--acento); color:var(--fondo); }
.sugerencias { display:flex; flex-wrap:wrap; margin-top:6px; }
.sugerencias .btn { margin:0 6px 6px 0; font-size:14px; padding:6px 12px; background:var(--hoja); color:var(--tinta); }

/* Fin de año */
.cuenta-atras { display:flex; align-items:baseline; }
.cuenta-atras .num { font-size:56px; font-weight:700; line-height:1; letter-spacing:-1px; color:var(--acento); }
.cuenta-atras .txt { margin-left:10px; color:var(--suave); }
.barra { height:6px; border-radius:3px; background:var(--linea); margin:10px 8px 4px 0; overflow:hidden; }
.barra div { height:100%; background:var(--acento); border-radius:3px; }

/* Pagos */
.pago { display:flex; align-items:center; background:var(--hoja); border-radius:18px; padding:12px 12px 12px 16px; margin-bottom:10px; }
.pago.urgente { background:var(--tinta); color:var(--fondo); }
.pago.urgente .cuando { color:var(--fondo); opacity:.7; }
.pago.urgente .btn { background:var(--fondo); color:var(--tinta); }
.pago .info { flex:1; min-width:0; }
.pago .concepto { font-weight:600; }
.pago .cuando { color:var(--suave); font-size:14px; }
.pago .monto { font-size:26px; font-weight:700; margin:0 10px; }
.meta { display:flex; align-items:center; min-height:54px; }
.meta .info { flex:1; min-width:0; }
.meta .barra { margin:6px 10px 0 0; }
.meta .valor { font-size:24px; font-weight:700; margin-right:4px; }
.meta .valor small { font-size:14px; font-weight:500; color:var(--suave); }
.mas { width:38px; height:38px; flex:none; border-radius:50%; border:0; background:var(--hoja); color:var(--tinta); font-size:20px; margin-left:6px; }
.mas.fuerte { background:var(--tinta); color:var(--fondo); }
.semana { font-size:20px; font-weight:600; margin:12px 0 6px; }
.publicacion { padding:6px 0 10px; }
.publicacion .detalle { font-size:14px; color:var(--suave); margin:4px 0 0 38px; }
.publicacion .copia { white-space:pre-line; background:var(--hoja); border-radius:12px; padding:10px 12px; margin:8px 8px 0 38px; font-size:15px; }
.tipo { font-weight:600; }
select { flex:1; min-width:0; font:inherit; padding:10px 16px; border:0; border-radius:999px; background:var(--hoja);
  color:var(--tinta); -webkit-appearance:none; outline:none; min-height:42px; }
.gasto { display:flex; align-items:center; min-height:40px; font-size:15px; }
.gasto .texto { color:var(--tinta); }
.gasto .cifra { font-weight:600; margin-left:8px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="reloj condensada" id="reloj">--:--</div>
    <div class="fecha" id="fecha"></div>
    <div class="saludo"><span id="saludo"></span><button data-a="nombre">Cambiar nombre</button></div>
  </div>
  <div class="clima" id="clima"></div>
</header>

<main>
  <section>
    <h2 class="condensada">Contenido <button class="enlace" data-a="editar_rutinas" id="btnEditar">Editar</button></h2>
    <div id="contenido"></div>
    <div id="canal"></div>
    <h2 class="condensada" style="margin-top:18px">Ven a la tienda</h2>
    <div id="plan"></div>
  </section>

  <section>
    <h2 class="condensada">Pendientes <span class="cuenta" id="cuentaPend"></span></h2>
    <div id="listas"></div>
    <div class="fila"><input id="nuevaLista" placeholder="Nueva lista"><button class="btn" data-a="nueva_lista">Crear</button></div>
  </section>

  <section>
    <h2 class="condensada">Pagos <span class="cuenta" id="totalPagos"></span></h2>
    <div id="pagos"></div>
    <div class="tarjeta" style="padding:6px 12px 12px">
      <div class="fila"><input id="pConcepto" placeholder="Nuevo pago, ej. Luz"></div>
      <div class="fila"><input id="pMonto" type="number" inputmode="decimal" placeholder="Monto"><input id="pFecha" type="date"></div>
      <div class="fila"><button class="btn fantasma" data-a="mensual" id="pMensual">Cada mes</button><span style="flex:1"></span><button class="btn" data-a="nuevo_pago">Agregar</button></div>
    </div>
    <h2 class="condensada" style="margin-top:18px">Gastos <span class="cuenta" id="totalGastos"></span></h2>
    <div id="gastos"></div>
    <div class="tarjeta" style="padding:6px 12px 12px">
      <div class="fila"><input id="gConcepto" placeholder="Nuevo gasto, ej. Anuncios Meta"></div>
      <div class="fila"><input id="gMonto" type="number" inputmode="decimal" placeholder="Monto"><select id="gCategoria"></select></div>
      <div class="fila"><input id="gFecha" type="date"><button class="btn" data-a="nuevo_gasto">Agregar</button></div>
    </div>
    <h2 class="condensada" style="margin-top:18px">Fechas clave <span class="cuenta" id="cuentaFechas"></span></h2>
    <div id="fechas"></div>
  </section>
</main>

<script>
(function () {
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var INICIAL = ['D','L','M','X','J','V','S'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var SUGERENCIAS = ['Post de la tienda', 'Correo a suscriptores'];
  var pagoMensual = false, editando = false;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function limpiar(s) { return String(s == null ? '' : s).replace(/^\s+|\s+$/g, ''); }
  function minus(s) { return limpiar(s).toLowerCase(); }
  function nuevoId() { return Math.random().toString(36).slice(2, 10); }
  function dinero(n) { n = Math.round(Number(n) || 0); return '$' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function dos(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(d) { return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate()); }
  function aviso(t) { alert(t); }
  function diasHasta(fecha) {
    var p = fecha.split('-'), v = new Date(+p[0], p[1] - 1, +p[2]);
    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    return Math.round((v - hoy) / 86400000);
  }
  function fechaCorta(fecha) { var p = fecha.split('-'); return (+p[2]) + ' ' + MESES[p[1] - 1].slice(0, 3); }

  // ----- Almacenamiento en el iPad -----
  function leerJSON(clave, def) { try { return JSON.parse(localStorage.getItem(clave)) || def; } catch (e) { return def; } }
  function guardarJSON(clave, valor) {
    try { localStorage.setItem(clave, JSON.stringify(valor)); }
    catch (e) { aviso('No pude guardar en el iPad. Revisa que Safari no esté en modo privado.'); }
  }
  var config = leerJSON('panel_config', { nombre: '', lat: 22.1565, lon: -100.9855 });
  var datos = leerJSON('panel_datos', {});
  datos.listas = datos.listas || [];
  datos.pagos = datos.pagos || [];
  datos.rutinas = datos.rutinas || [];
  datos.hitos = datos.hitos || [];
  function guardar() { guardarJSON('panel_datos', datos); pintar(); }

  // ----- Campaña "Ven a la tienda" (oct–dic 2026) y campaña de correo -----
  // [inicio, fin, tema, Instagram, Facebook, Estados de WhatsApp, nota]
  var SEMANAS = [
    ['2026-10-06','2026-10-11','Arranque: conoce la tienda','Reel recorrido por la tienda; post fijado con horario y mapa','Mismo reel + post con ubicación','Foto de la fachada con horario','Actualizar fotos y horario del perfil de Google'],
    ['2026-10-13','2026-10-18','Muro de tablas','Carrusel “¿qué medida de tabla me queda?”','Mismo carrusel, enfocado a papás','3 tablas nuevas con precio','Enlazar la guía de medidas'],
    ['2026-10-20','2026-10-25','Arma tu tabla','Reel armando una completa en el mostrador','Post “tu primera tabla” para principiantes','Video corto del armado',''],
    ['2026-10-27','2026-11-01','Halloween y Día de Muertos','Reel con gráficos de tablas de calaveras y Creature','Post temático','Sticker gratis por visita esa semana','Regalar stickers en mostrador'],
    ['2026-11-03','2026-11-08','Sesión Kyoto 1','Invitación a sesión en spot de SLP; historias en vivo','Evento de Facebook','Invitación','Primera actividad de comunidad'],

    ['2026-11-16','2026-11-22','Buen Fin (cierre) y resultados','Historias diarias de ofertas hasta el martes 17; fotos de clientes','Fotos de la sesión y del Buen Fin','“Último día” el 17','Pedir reseñas a quien compró'],

    ['2026-12-14','2026-12-20','Recta final de regalos','Reel “te ayudamos a elegir”; recordatorio de horario','Post para papás','Horario de diciembre','Confirmar horario extendido si lo hay'],
    ['2026-12-21','2026-12-27','Últimos regalos','Historias diarias, último día antes de Navidad','Post “todavía llegas”','Recordatorio 23 y 24',''],
    ['2026-12-28','2026-12-31','Cierre del año','Reel con lo mejor del año y clientes','Agradecimiento','Agradecimiento','Medir resultados']
  ];
  var METAS = [['visitas','Visitas por la campaña',150],['resenas','Reseñas nuevas en Google',30],['contactos','Contactos nuevos de WhatsApp',200]];
  var HITOS_PLAN = [
    ['','Anotar los números de hoy: reseñas, seguidores, contactos y ventas de tienda'],
    ['','Actualizar fotos, horario y descripción del perfil de Google'],
    ['2026-10-08','Post fijado “Visítanos”'],
    ['2026-10-08','Reel recorrido por la tienda'],
    ['2026-10-08','Plantilla de Estado de WhatsApp'],
    ['2026-10-14','Carrusel de medidas de tabla'],

  datos.metas = datos.metas || { visitas: 0, resenas: 0, contactos: 0 };

    guardarJSON('panel_datos', datos);

  var verCumplidas = false;

  // ----- Canal de WhatsApp (pestaña "Canal WhatsApp" de la hoja Productos Claude) -----
  // [fecha, hora, tipo, texto, foto o video, nota]

        if (!e.hecho) pendientes++;
        h += '<div class="elem' + (e.hecho ? ' hecho' : '') + '"><button class="caja" data-a="marcar" data-id="' + e.id + '">' + (e.hecho ? '✓' : '') + '</button>' +
             '<span class="texto">' + esc(e.texto) + '</span><button class="quitar" data-a="quitar" data-id="' + e.id + '">×</button></div>';
      }
      h += '<div class="fila"><input data-lista="' + esc(l.nombre) + '" placeholder="Agregar a ' + esc(l.nombre) + '"><button class="btn" data-a="agregar">+</button></div></div>';
    }
    $('listas').innerHTML = h;
    $('cuentaPend').innerHTML = pendientes ? pendientes + ' sin hacer' : '';
  }
  function buscarElemento(id) {
    for (var i = 0; i < datos.listas.length; i++)
      for (var j = 0; j < datos.listas[i].elementos.length; j++)
        if (datos.listas[i].elementos[j].id === id) return [i, j];
    return null;
  }

  // ----- Pagos -----
  function pintarPagos() {
    var pagos = datos.pagos.slice().sort(function (a, b) { return a.vence < b.vence ? -1 : 1; });
    var h = '', totalMes = 0, hoy = new Date();
    if (!pagos.length) h = '<p class="vacio">Nada por pagar. Agrega tus pagos abajo.</p>';
    for (var i = 0; i < pagos.length; i++) {
      var p = pagos[i], n = diasHasta(p.vence), f = p.vence.split('-');
      if (+f[0] === hoy.getFullYear() && +f[1] === hoy.getMonth() + 1) totalMes += Number(p.monto) || 0;
      var cuando = n < 0 ? 'Vencido hace ' + (-n) + (n === -1 ? ' día' : ' días') : n === 0 ? 'Vence hoy' : n === 1 ? 'Vence mañana' : 'Vence en ' + n + ' días';
      if (p.mensual) cuando += ', cada mes';
      h += '<div class="pago' + (n <= 3 ? ' urgente' : '') + '"><div class="info"><div class="concepto">' + esc(p.concepto) + '</div>' +
           '<div class="cuando">' + cuando + '</div></div><div class="monto condensada">' + dinero(p.monto) + '</div>' +
           '<button class="btn" data-a="pagar" data-id="' + p.id + '">Pagué</button></div>';
    }
    $('pagos').innerHTML = h;
    $('totalPagos').innerHTML = totalMes ? dinero(totalMes) + ' este mes' : '';
  }

  function pintar() { pintarContenido(); pintarCanal(); pintarPlan(); pintarListas(); pintarPagos(); pintarGastos(); }

  // ----- Acciones -----
  var acciones = {
    nombre: function () {
      var n = prompt('¿Cómo te llamo?', config.nombre || '');
      if (n === null) return;
      config.nombre = limpiar(n); guardarJSON('panel_config', config); ultimoMinuto = -1; reloj();
    },
    editar_rutinas: function () { editando = !editando; $('btnEditar').innerHTML = editando ? 'Listo' : 'Editar'; pintarContenido(); },
    sugerencia: function (b) { $('rNombre').value = b.getAttribute('data-t'); $('rNombre').focus(); },
    nueva_rutina: function () {
      var v = limpiar($('rNombre').value);
      if (!v) return;
      datos.rutinas.push({ id: nuevoId(), nombre: v, dias: [], hechos: {} });
      guardar();
    },
    borrar_rutina: function (b, id) { var i = buscarRutina(id); if (i >= 0 && confirm('¿Borrar "' + datos.rutinas[i].nombre + '"?')) { datos.rutinas.splice(i, 1); guardar(); } },
    dia: function (b, id) {
      var r = datos.rutinas[buscarRutina(id)], d = +b.getAttribute('data-d'), k = r.dias.indexOf(d);
      if (k >= 0) r.dias.splice(k, 1); else r.dias.push(d);
      guardar();
    },
    rutina_hecha: function (b, id) {
      var r = datos.rutinas[buscarRutina(id)], clave = iso(new Date());
      r.hechos = r.hechos || {};
      if (r.hechos[clave]) delete r.hechos[clave]; else r.hechos[clave] = true;
      limpiarHechos(r); guardar();
    },
    nuevo_hito: function () {
      var t = limpiar($('hTexto').value);
      if (!t) { aviso('Escribe la meta.'); return; }
      datos.hitos.push({ id: nuevoId(), texto: t, fecha: $('hFecha').value || '', hecho: false });
      guardar();
    },
    hito: function (b, id) { var i = buscarHito(id); if (i >= 0) { datos.hitos[i].hecho = !datos.hitos[i].hecho; guardar(); } },
    canal_hecho: function (b, id) { var c = buscarCanal(id); if (c) { c.hecho = !c.hecho; guardar(); } },
    canal_texto: function (b, id) { canalAbierto = canalAbierto === id ? null : id; pintarCanal(); },
    nuevo_gasto: function () {
      var c = limpiar($('gConcepto').value), m = Number($('gMonto').value) || 0;
      if (!c) { aviso('Escribe en qué gastaste.'); return; }
      if (!m) { aviso('Escribe el monto.'); return; }
      datos.gastos.push({ id: nuevoId(), fecha: $('gFecha').value || iso(new Date()), categoria: $('gCategoria').value, concepto: c, monto: m });
      $('gConcepto').value = ''; $('gMonto').value = ''; $('gFecha').value = '';
      guardar();
    },
    borrar_gasto: function (b, id) {
      for (var i = 0; i < datos.gastos.length; i++) if (datos.gastos[i].id === id && confirm('¿Borrar "' + datos.gastos[i].concepto + '"?')) { datos.gastos.splice(i, 1); guardar(); return; }
    },
    meta_mas: function (b, k) { datos.metas[k] = (datos.metas[k] || 0) + 1; guardar(); },
    meta_menos: function (b, k) { datos.metas[k] = Math.max(0, (datos.metas[k] || 0) - 1); guardar(); },
    ver_cumplidas: function () { verCumplidas = !verCumplidas; pintarPlan(); },
    borrar_hito: function (b, id) { var i = buscarHito(id); if (i >= 0) { datos.hitos.splice(i, 1); guardar(); } },
    marcar: function (b, id) { var p = buscarElemento(id); if (p) { var e = datos.listas[p[0]].elementos[p[1]]; e.hecho = !e.hecho; guardar(); } },
    quitar: function (b, id) { var p = buscarElemento(id); if (p) { datos.listas[p[0]].elementos.splice(p[1], 1); guardar(); } },
    borrar_lista: function (b, id) {
      for (var i = 0; i < datos.listas.length; i++) if (datos.listas[i].id === id && confirm('¿Borrar la lista "' + datos.listas[i].nombre + '"?')) { datos.listas.splice(i, 1); guardar(); return; }
    },
    agregar: function (b) { agregarDesde(b.parentNode.querySelector('input')); },
    nueva_lista: function () {
      var v = limpiar($('nuevaLista').value);
      if (!v) return;
      for (var i = 0; i < datos.listas.length; i++) if (minus(datos.listas[i].nombre) === minus(v)) { aviso('Ya tienes una lista con ese nombre.'); return; }
      datos.listas.push({ id: nuevoId(), nombre: v, elementos: [] });
      $('nuevaLista').value = ''; guardar();
    },
    mensual: function (b) { pagoMensual = !pagoMensual; b.className = 'btn fantasma' + (pagoMensual ? ' activo' : ''); },
    nuevo_pago: function () {
      var c = limpiar($('pConcepto').value), f = $('pFecha').value;
      if (!c) { aviso('Escribe qué vas a pagar.'); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(f)) { aviso('Elige la fecha en que vence.'); return; }
      datos.pagos.push({ id: nuevoId(), concepto: c, monto: Number($('pMonto').value) || 0, vence: f, mensual: pagoMensual });
      $('pConcepto').value = ''; $('pMonto').value = ''; $('pFecha').value = '';
      pagoMensual = false; $('pMensual').className = 'btn fantasma';
      guardar();
    },
    pagar: function (b, id) {
      for (var i = 0; i < datos.pagos.length; i++) if (datos.pagos[i].id === id) {
        var p = datos.pagos[i];
        if (p.mensual) { var f = p.vence.split('-'); p.vence = iso(new Date(+f[0], +f[1], +f[2])); }
        else datos.pagos.splice(i, 1);
        guardar(); return;
      }
    }
  };
  function agregarDesde(input) {
    var t = limpiar(input.value), nombre = input.getAttribute('data-lista');
    if (!t) return;
    for (var i = 0; i < datos.listas.length; i++) if (datos.listas[i].nombre === nombre) {
      datos.listas[i].elementos.push({ id: nuevoId(), texto: t, hecho: false });
      guardar(); return;
    }
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target;
    while (b && b.nodeType === 1 && !b.getAttribute('data-a')) b = b.parentNode;
    if (!b || b.nodeType !== 1) return;
    var fn = acciones[b.getAttribute('data-a')];
    if (fn) fn(b, b.getAttribute('data-id'));
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.keyCode !== 13 || !ev.target.getAttribute) return;
    var t = ev.target, id = t.id;
    if (t.getAttribute('data-lista') !== null) agregarDesde(t);
    else if (id === 'nuevaLista') acciones.nueva_lista();
    else if (id === 'rNombre') acciones.nueva_rutina();
    else if (id === 'hTexto') acciones.nuevo_hito();
    else if (id === 'pConcepto' || id === 'pMonto') acciones.nuevo_pago();
    else if (id === 'gConcepto' || id === 'gMonto') acciones.nuevo_gasto();
  });

  // ----- Arranque -----
  (function () {
    var h = '';
    for (var i = 0; i < CATEGORIAS.length; i++) h += '<option>' + CATEGORIAS[i] + '</option>';
    $('gCategoria').innerHTML = h;
  })();
  reloj();
  setInterval(reloj, 1000);
  cargarClima();
  setInterval(cargarClima, 900000);
})();
</script>
</body>
</html>
